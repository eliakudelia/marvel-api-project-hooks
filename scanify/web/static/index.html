<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scanify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232f6f4f%27/%3E%3Crect x=%278%27 y=%276%27 width=%2716%27 height=%2720%27 rx=%272%27 fill=%27%23fff%27/%3E%3Cg fill=%27%232f6f4f%27%3E%3Crect x=%2711%27 y=%2711%27 width=%2710%27 height=%271.6%27/%3E%3Crect x=%2711%27 y=%2715%27 width=%2710%27 height=%271.6%27/%3E%3Crect x=%2711%27 y=%2719%27 width=%276%27 height=%271.6%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f4f3; --panel: #ffffff; --ink: #1b1b1a; --muted: #6d6d6a;
    --line: #dedeD9; --accent: #2f6f4f; --accent-ink: #ffffff; --shadow: rgba(0,0,0,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --ink: #e8e8e6; --muted: #9a9a97;
      --line: #33363a; --accent: #4d9c74; --accent-ink: #0d1210; --shadow: rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  header .name { color: var(--muted); font-size: 13px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes .mode { border: 0; border-radius: 0; padding: 6px 15px; font-size: 13px; }
  .modes .mode[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  header select {
    font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); border-radius: 7px; padding: 7px 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  main { display: grid; grid-template-columns: 330px 1fr; min-height: calc(100vh - 55px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--line); background: var(--panel); padding: 16px;
    position: sticky; top: 55px; align-self: start;
    max-height: calc(100vh - 55px); overflow-y: auto;
  }
  @media (max-width: 820px) { aside { position: static; max-height: none; } }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--muted); margin: 0 0 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { padding: 6px 11px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  details { border-top: 1px solid var(--line); padding: 9px 0; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; padding: 3px 0; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }

  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 11px 0 4px; }
  .row label { font-size: 13px; }
  .row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .row select, .row input[type=number] {
    grid-column: 1 / -1; font: inherit; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .seed { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .seed input { grid-column: auto; }

  section.stage { padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 60px 40px;
    text-align: center; color: var(--muted); width: min(560px, 100%); margin: auto;
  }
  #drop.over { border-color: var(--accent); color: var(--ink); }
  #drop strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .viewer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .paper { position: relative; box-shadow: 0 3px 18px var(--shadow); background: var(--panel); border-radius: 2px; }
  .paper img { display: block; max-width: 100%; max-height: 80vh; border-radius: 2px; }
  .paper.busy img { opacity: .55; }
  .spinner {
    position: absolute; inset: 0; margin: auto; width: 26px; height: 26px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: none;
  }
  .paper.busy .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .bar .count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 82px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; }
  .error { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .error { color: #ef8a7d; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>scanify</h1>
  <div class="modes" id="modes">
    <button class="mode" data-mode="scan" aria-pressed="true">Скан</button>
    <button class="mode" data-mode="photo" aria-pressed="false">Фото</button>
  </div>
  <span class="name" id="docName">файл не выбран</span>
  <select id="scope" class="hidden" title="Что сохранить">
    <option value="page">эта страница · JPEG</option>
    <option value="all">все страницы · PDF</option>
  </select>
  <button id="pick">Открыть PDF</button>
  <button id="download" class="primary" disabled>Скачать</button>
</header>

<main>
  <aside>
    <h2>Пресет</h2>
    <div class="chips" id="presets"></div>
    <div id="groups"></div>
    <p class="note" id="previewNote"></p>
  </aside>

  <section class="stage">
    <div id="drop">
      <strong>Перетащите PDF сюда</strong>
      или нажмите «Открыть PDF» вверху
    </div>

    <div class="viewer hidden" id="viewer">
      <div class="paper" id="paper">
        <img id="preview" alt="Предпросмотр страницы">
        <div class="spinner"></div>
      </div>
      <div class="bar">
        <button id="prev">←</button>
        <span class="count" id="count"></span>
        <button id="next">→</button>
      </div>
      <p class="note" id="status"></p>
    </div>
  </section>
</main>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script>

const SCAN_GROUPS = [
  ["Геометрия", [
    {k:"rotate",      t:"Перекос, °",         min:0,   max:3,     step:0.05},
    {k:"shift",       t:"Сдвиг, пикс.",       min:0,   max:20,    step:0.5},
    {k:"bow",         t:"Прогиб страницы",    min:0,   max:0.02,  step:0.001, dp:3},
    {k:"wave",        t:"Волна",              min:0,   max:5,     step:0.1},
  ]],
  ["Бумага", [
    {k:"yellow",      t:"Желтизна",           min:0,   max:1.5,   step:0.05, tint:"paper_tint"},
    {k:"paper_blotch",t:"Пятна",              min:0,   max:0.3,   step:0.005, dp:3},
    {k:"paper_fiber", t:"Волокно",            min:0,   max:0.08,  step:0.002, dp:3},
  ]],
  ["Свет", [
    {k:"vignette",    t:"Виньетка",           min:0,   max:0.5,   step:0.01},
    {k:"fold_shadow", t:"Тень от корешка",    min:0,   max:0.7,   step:0.01},
    {k:"brightness",  t:"Разброс экспозиции", min:0,   max:0.15,  step:0.005, dp:3},
  ]],
  ["Оптика и тонер", [
    {k:"blur",        t:"Расфокус",           min:0,   max:3,     step:0.05},
    {k:"bleed",       t:"Растекание тонера",  min:0,   max:1,     step:0.02},
  ]],
  ["Тон", [
    {k:"contrast",    t:"Контраст",           min:0.6, max:2,     step:0.02},
    {k:"gamma",       t:"Гамма",              min:0.6, max:1.6,   step:0.02},
    {k:"black_point", t:"Подъём чёрного",     min:0,   max:0.25,  step:0.005, dp:3},
  ]],
  ["Сенсор", [
    {k:"noise",       t:"Шум",                min:0,   max:0.08,  step:0.002, dp:3},
    {k:"dust",        t:"Пыль, шт./Мпикс",    min:0,   max:300,   step:5, scale:1e-6, dp:0},
    {k:"scratches",   t:"Царапины",           min:0,   max:6,     step:1, dp:0},
  ]],
  ["Вывод", [
    {k:"mode",    t:"Цвет",     select:[["gray","оттенки серого"],["color","цветной"],["bw","1 бит"]]},
    {k:"dpi",     t:"Разрешение", select:[[100,"100 dpi"],[150,"150 dpi"],[200,"200 dpi"],[300,"300 dpi"],[400,"400 dpi"]]},
    {k:"quality", t:"Качество JPEG", min:20, max:95, step:1, dp:0},
    {k:"seed",    t:"Зерно случайности", seed:true},
  ]],
];

const PHOTO_GROUPS = [
  ["Кадр", [
    {k:"margin",      t:"Поля вокруг листа",  min:0,   max:0.35,  step:0.01},
    {k:"tilt",        t:"Наклон, °",          min:0,   max:15,    step:0.5},
    {k:"perspective", t:"Перспектива",        min:0,   max:0.25,  step:0.005, dp:3},
    {k:"offset",      t:"Смещение от центра", min:0,   max:0.08,  step:0.005, dp:3},
  ]],
  ["Поверхность", [
    {k:"shade",         t:"Яркость фона",     min:0.55, max:1.15, step:0.01, tint:"surface"},
    {k:"surface_blotch",t:"Пятна",            min:0,   max:0.25,  step:0.005, dp:3},
    {k:"surface_streak",t:"Фактура",          min:0,   max:0.2,   step:0.005, dp:3},
    {k:"surface_grain", t:"Зерно",            min:0,   max:0.05,  step:0.002, dp:3},
  ]],
  ["Свет", [
    {k:"light_angle",   t:"Откуда свет, °",   min:0,   max:355,   step:5, dp:0},
    {k:"light_falloff", t:"Перепад света",    min:0,   max:0.6,   step:0.01},
    {k:"curl",          t:"Прогиб листа",     min:0,   max:0.25,  step:0.005, dp:3},
    {k:"edge_light",    t:"Толщина листа",    min:0,   max:0.2,   step:0.005, dp:3},
  ]],
  ["Тень", [
    {k:"shadow",        t:"Сила тени",        min:0,   max:0.9,   step:0.02},
    {k:"shadow_offset", t:"Смещение тени",    min:0,   max:0.06,  step:0.002, dp:3},
    {k:"shadow_blur",   t:"Мягкость тени",    min:0,   max:0.06,  step:0.002, dp:3},
    {k:"contact",       t:"Тень у края",      min:0,   max:0.6,   step:0.02},
  ]],
  ["Камера", [
    {k:"defocus",   t:"Расфокус по краям",    min:0,   max:0.012, step:0.0002, dp:4},
    {k:"vignette",  t:"Виньетка",             min:0,   max:0.5,   step:0.01},
    {k:"chromatic", t:"Хроматизм",            min:0,   max:0.004, step:0.0001, dp:4},
    {k:"noise",     t:"Шум",                  min:0,   max:0.05,  step:0.002, dp:3},
    {k:"warmth",    t:"Теплота",              min:-0.1, max:0.25, step:0.01},
    {k:"exposure",  t:"Экспозиция",           min:-0.2, max:0.2,  step:0.01},
  ]],
  ["Вывод", [
    {k:"width",   t:"Ширина, пикс.", select:[[900,"900"],[1200,"1200"],[1600,"1600"],[2000,"2000"],[2600,"2600"]]},
    {k:"quality", t:"Качество JPEG", min:40, max:95, step:1, dp:0},
    {k:"seed",    t:"Зерно случайности", seed:true},
  ]],
];

// Each mode is a self-contained description of its presets, its controls and
// the two endpoints it talks to, so adding a third mode stays a data change.
const MODES = {
  scan: {
    groups: SCAN_GROUPS, presets: {}, fallback: "office",
    preview: "/api/preview", convert: "/api/convert",
    // Three tint channels behind one slider: 0 is white, 1 matches "worn".
    tint: { paper_tint: {
      to: (y) => [1, +(1 - 0.045 * y).toFixed(4), +(1 - 0.145 * y).toFixed(4)],
      from: (c) => +((1 - (c ? c[2] : 1)) / 0.145).toFixed(2) } },
  },
  photo: {
    groups: PHOTO_GROUPS, presets: {}, fallback: "desk",
    preview: "/api/photo/preview", convert: "/api/photo/convert",
    // The surface keeps the preset's hue; the slider only scales it.
    tint: { surface: {
      to: function (k) { return this.base.map((c) => +Math.min(1, c * k).toFixed(4)); },
      from: function (c) { return +((c ? c[0] : 1) / this.base[0]).toFixed(3); },
      base: [1, 1, 1] } },
  },
};

const $ = (id) => document.getElementById(id);
let mode = "scan", settings = {}, doc = null, page = 0, inflight = null, timer = null;
const chosen = { scan: null, photo: null };
const saved = { scan: null, photo: null };

const current = () => MODES[mode];

function fmt(spec, value) {
  if (spec.dp === 0) return String(Math.round(value));
  return value.toFixed(spec.dp ?? 2);
}

function buildControls() {
  const host = $("groups");
  host.innerHTML = "";
  current().groups.forEach(([title, specs], i) => {
    const box = document.createElement("details");
    if (i < 2) box.open = true;
    box.innerHTML = `<summary>${title}</summary>`;
    specs.forEach((spec) => box.appendChild(control(spec)));
    host.appendChild(box);
  });
}

function control(spec) {
  const row = document.createElement("div");
  row.className = "row";
  const id = "c_" + spec.k;

  if (spec.select) {
    row.innerHTML = `<label for="${id}">${spec.t}</label><output></output>
      <select id="${id}">${spec.select.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`;
    const el = row.querySelector("select");
    el.addEventListener("change", () => {
      settings[spec.k] = isNaN(+el.value) ? el.value : +el.value;
      refresh();
    });
  } else if (spec.seed) {
    row.innerHTML = `<label for="${id}">${spec.t}</label><output></output>
      <div class="seed"><input type="number" id="${id}" min="0" step="1"><button type="button" title="Другой случайный вид">🎲</button></div>`;
    const el = row.querySelector("input");
    el.addEventListener("change", () => { settings.seed = Math.max(0, parseInt(el.value || 0, 10)); refresh(); });
    row.querySelector("button").addEventListener("click", () => {
      settings.seed = Math.floor(Math.random() * 100000); syncControls(); refresh();
    });
  } else {
    row.innerHTML = `<label for="${id}">${spec.t}</label><output></output>
      <input type="range" id="${id}" min="${spec.min}" max="${spec.max}" step="${spec.step}">`;
    const el = row.querySelector("input");
    el.addEventListener("input", () => {
      const value = +el.value;
      row.querySelector("output").textContent = fmt(spec, value);
      if (spec.tint) settings[spec.tint] = current().tint[spec.tint].to(value);
      else settings[spec.k] = spec.scale ? value * spec.scale : value;
      refresh();
    });
  }
  row.dataset.key = spec.k;
  row._spec = spec;
  return row;
}

function syncControls() {
  document.querySelectorAll(".row[data-key]").forEach((row) => {
    const spec = row._spec, key = spec.k;
    let value;
    if (spec.tint) value = current().tint[spec.tint].from(settings[spec.tint]);
    else if (spec.scale) value = (settings[key] ?? 0) / spec.scale;
    else value = settings[key];

    const range = row.querySelector("input[type=range]");
    if (range) {
      range.value = value;
      row.querySelector("output").textContent = fmt(spec, +range.value);
    }
    const select = row.querySelector("select");
    if (select) select.value = String(value);
    const number = row.querySelector("input[type=number]");
    if (number) number.value = value ?? 1;
  });
}

function applyPreset(name) {
  const spec = current();
  settings = { ...spec.presets[name] };
  if (settings.seed === null || settings.seed === undefined) settings.seed = 1;
  // Remember the preset's own colours; the tint sliders work relative to them.
  Object.values(spec.tint || {}).forEach((t) => {
    if (t.base && settings.surface) t.base = settings.surface.slice();
  });
  chosen[mode] = name;
  saved[mode] = settings;
  document.querySelectorAll(".chip").forEach((c) =>
    c.setAttribute("aria-pressed", String(c.dataset.name === name)));
  syncControls();
  refresh();
}

function fillChips() {
  const host = $("presets");
  host.innerHTML = "";
  Object.keys(current().presets).forEach((name) => {
    const chip = document.createElement("button");
    chip.className = "chip"; chip.textContent = name; chip.dataset.name = name;
    chip.setAttribute("aria-pressed", "false");
    chip.addEventListener("click", () => applyPreset(name));
    host.appendChild(chip);
  });
}

function switchMode(next) {
  if (next === mode) return;
  saved[mode] = settings;
  mode = next;
  document.querySelectorAll(".mode").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  fillChips();
  buildControls();
  if (saved[mode]) {
    settings = saved[mode];
    document.querySelectorAll(".chip").forEach((c) =>
      c.setAttribute("aria-pressed", String(c.dataset.name === chosen[mode])));
    syncControls();
    refresh();
  } else {
    applyPreset(current().fallback);
  }
  updateScope();
}

function updateScope() {
  const show = mode === "photo" && doc && doc.pages > 1;
  $("scope").classList.toggle("hidden", !show);
}

function refresh() {
  if (!doc) return;
  clearTimeout(timer);
  timer = setTimeout(renderPreview, 220);
}

async function renderPreview() {
  if (!doc) return;
  if (inflight) inflight.abort();
  const controller = new AbortController();
  inflight = controller;
  $("paper").classList.add("busy");
  $("status").textContent = "";
  try {
    const response = await fetch(current().preview, {
      method: "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: doc.id, page, settings }),
    });
    if (!response.ok) throw new Error((await response.json()).error || "не удалось построить предпросмотр");
    const blob = await response.blob();
    const previous = $("preview").src;
    $("preview").src = URL.createObjectURL(blob);
    if (previous.startsWith("blob:")) URL.revokeObjectURL(previous);
  } catch (err) {
    if (err.name === "AbortError") return;
    fail(err.message);
  } finally {
    if (inflight === controller) { inflight = null; $("paper").classList.remove("busy"); }
  }
}

function fail(message) { $("status").textContent = message; $("status").className = "note error"; }

async function upload(file) {
  if (!file) return;
  $("status").className = "note";
  $("status").textContent = "Загружаю…";
  const body = new FormData();
  body.append("file", file);
  try {
    const response = await fetch("/api/documents", { method: "POST", body });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "не удалось загрузить файл");
    doc = data; page = 0;
    $("docName").textContent = `${data.name} · ${data.pages} стр.`;
    $("drop").classList.add("hidden");
    $("viewer").classList.remove("hidden");
    $("download").disabled = false;
    updateCount();
    updateScope();
    $("status").textContent = "";
    renderPreview();
  } catch (err) { fail(err.message); }
}

function updateCount() {
  $("count").textContent = doc ? `${page + 1} / ${doc.pages}` : "";
  $("prev").disabled = !doc || page === 0;
  $("next").disabled = !doc || page >= doc.pages - 1;
}

function step(delta) {
  if (!doc) return;
  page = Math.max(0, Math.min(doc.pages - 1, page + delta));
  updateCount();
  renderPreview();
}

async function download() {
  if (!doc) return;
  const button = $("download");
  button.disabled = true;
  const label = button.textContent;
  button.textContent = "Обрабатываю…";
  $("status").className = "note";
  const scope = mode === "photo" ? $("scope").value : "all";
  const total = (mode === "scan" || scope === "all") ? doc.pages : 1;
  $("status").textContent = `Обрабатываю ${total} стр.…`;
  try {
    const response = await fetch(current().convert, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: doc.id, name: doc.name, settings, page, scope }),
    });
    if (!response.ok) throw new Error((await response.json()).error || "не удалось обработать документ");
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const stem = doc.name.replace(/\.pdf$/i, "");
    const fromServer = (response.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)"?/);
    link.href = url;
    link.download = fromServer ? fromServer[1] : `${stem}-out`;
    link.click();
    URL.revokeObjectURL(url);
    $("status").textContent = "Готово.";
  } catch (err) { fail(err.message); }
  finally { button.disabled = false; button.textContent = label; }
}

$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => upload(e.target.files[0]));
$("download").addEventListener("click", download);
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
document.querySelectorAll(".mode").forEach((b) =>
  b.addEventListener("click", () => switchMode(b.dataset.mode)));
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
["dragenter", "dragover"].forEach((type) =>
  document.addEventListener(type, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((type) =>
  document.addEventListener(type, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
document.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));

(async function start() {
  const config = await (await fetch("/api/presets")).json();
  const order = {
    scan: ["clean", "office", "book", "worn", "photocopy", "fax"],
    photo: ["table", "desk", "wood", "handheld", "overhead", "evening"],
  };
  const sortBy = (list) => (a, b) => (list.indexOf(a) + 1 || 99) - (list.indexOf(b) + 1 || 99);
  for (const [key, raw] of [["scan", config.presets], ["photo", config.photo_presets]]) {
    Object.keys(raw).sort(sortBy(order[key])).forEach((name) => { MODES[key].presets[name] = raw[name]; });
  }
  MODES.scan.fallback = config.default;
  MODES.photo.fallback = config.photo_default;
  $("previewNote").textContent =
    `Предпросмотр строится уменьшенным ради скорости — скан при ${config.preview_dpi} dpi, ` +
    `фото шириной ${config.photo_preview_width} пикс. Скачанный файл использует выбранный размер.`;
  fillChips();
  buildControls();
  applyPreset(MODES.scan.fallback);
})();
</script>
